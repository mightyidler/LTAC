name: Release LTAC

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltac-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: npm ci
      - run: npm run check:repository
      - run: node tools/check-repository.mjs --history
      - name: Verify matching versions and tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Run this workflow against the matching version tag.' }
          node tools/check-release.mjs
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: npm run core:release
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: npm test
      - name: Save verified build dependencies
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build and sign installer including power service
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # The existing tag fixes the source commit. Use the default branch for
          # release creation so older workflow files do not require Workflows:write.
          releaseCommitish: ${{ github.event.repository.default_branch }}
          releaseName: 'LTAC ${{ github.ref_name }}'
          releaseBody: |
            Windows x64용 LG webOS TV 자동 전원 제어.

            - HDMI 선택 메뉴의 항목 높이와 여백을 늘리고 모서리를 다듬었습니다.
            - HDMI 변경 시 공통 텍스트는 유지하고 바뀐 부분에 전환 효과를 적용했습니다.
            - HDMI 메뉴의 크기와 선택 텍스트 전환에 대한 회귀 검증을 보강했습니다.

            데스크톱 앱·CLI·Windows 전원 서비스와 서명된 앱 내 업데이트를 포함합니다.
            실제 TV 전원·PC 절전·재부팅·종료 통합 시험은 자동 검증에 포함되지 않습니다.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles nsis
      - name: Verify packaged resources and generate manifest
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/LTAC_${version}_x64-setup.exe"
          if (-not $installer) { throw 'Installer missing' }
          node tools/check-release.mjs --package
          node tools/verify-update.mjs $installer.FullName
          node tools/publish-update.mjs $installer.FullName
      - name: Verify actual installer and first-run desktop lifecycle
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "src-tauri/target/release/bundle/nsis/LTAC_${version}_x64-setup.exe"
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/check-installer.ps1 -Installer $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer lifecycle regression failed' }
      - name: Publish verified release
        run: gh release edit "$env:GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish update manifest on main
        shell: bash
        run: |
          cp update.json "$RUNNER_TEMP/ltac-update.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/ltac-update.json" update.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add update.json
          git diff --staged --quiet || git commit -m "chore: publish update manifest for ${{ github.ref_name }}"
          git push origin HEAD:main
