name: Repository checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: node tools/check-repository.mjs --history
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
