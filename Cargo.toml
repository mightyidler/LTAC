[package]
name = "ltac"
version = "0.1.4"
edition = "2024"
description = "Minimal LG webOS TV power control for Windows"
rust-version = "1.89"
default-run = "ltac"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = { version = "0.3", features = ["sink"] }
if-addrs = "0.15"
reqwest = { version = "0.12", default-features = false }
roxmltree = "0.21"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "io-util", "signal", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Services", "Win32_System_SystemServices", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
